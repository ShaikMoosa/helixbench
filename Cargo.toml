[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/storage",
    "crates/appcore",
    "apps/desktop_gpui",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
domain = { path = "crates/domain" }
storage = { path = "crates/storage" }
appcore = { path = "crates/appcore" }
gpui = "0.2.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true